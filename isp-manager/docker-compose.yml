services:
  postgres:
    image: postgres:16-alpine
    container_name: isp-manager-db
    restart: unless-stopped
    environment:
      # Credenciales por variable de entorno; defaults solo para dev local.
      # Se quitó POSTGRES_HOST_AUTH_METHOD: trust para exigir contraseña.
      POSTGRES_USER: ${POSTGRES_USER:-isp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isp123}
      POSTGRES_DB: ${POSTGRES_DB:-isp_manager}
      PGTZ: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
